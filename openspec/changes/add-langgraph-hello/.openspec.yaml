schema: spec-driven
name: add-langgraph-hello
status: verified
approval:
  reviewed_by: senthilsweb
  reviewed_date: 2026-07-24
  note: >
    Raised and built 2026-07-24. A deliberately tiny LangGraph StateGraph
    agent (ADR 0003 — no LangChain chains) that doubles as a clean
    Firecracker microVM smoke test. Origin: the youtube-transcriber service
    could not exercise the Firecracker path — the only host available
    (Hetzner Cloud, 5.75.250.223) has no /dev/kvm, and separately YouTube
    bot-blocks that datacenter IP. The owner chose to validate the microVM
    path with a smaller, self-contained agent instead: no LLM, no network,
    no model weights, no API key, so it builds tiny and boots fast, and its
    `probe` node / GET /whoami report the guest kernel, hostname and eth0 IP
    that prove microVM isolation.

    Owner decisions 2026-07-24: (1) build the agent now, host-independent;
    a KVM-capable host for the actual microVM boot comes later. (2) Keep it
    a genuine but minimal LangGraph example — one conditional edge, pydantic
    state, REST + CLI mirroring youtube-transcriber's shape.

    Construction complete 2026-07-24: pipeline/ (state, config, probe,
    graph), run.py, server/app.py (GET /healthz, POST /run, GET /whoami),
    tiny Dockerfile, tests. 10 pytest green via `.venv/bin/pytest` (bare
    invocation, no network, no secrets); CLI + live uvicorn smoke verified
    locally.

    VERIFIED 2026-07-24 on Intel bare metal (Vultr, 45.32.92.209, Ubuntu
    24.04, /dev/kvm present, systemd-detect-virt=none). langgraph-hello was
    built into a rootfs and booted as a real Firecracker microVM via the
    generic infra/firecracker/ tooling with DEFAULTS (no overrides), and it
    served: GET /healthz ready, GET /whoami reported kernel 5.10.233 while
    the HOST kernel is 6.8.0-136-generic — a different kernel, which a
    container cannot have, so this is unambiguously a microVM. POST /run
    executed the LangGraph inside the VM ("5 word(s) analyzed on 172.16.0.2
    (kernel 5.10.233)"). containerized:false (the rootfs no longer carries
    Docker's marker).

    The bring-up surfaced three real defects in the infra/firecracker/
    tooling, all fixed in commit a5667df: (1) install-firecracker.sh pulled
    the ancient 4.14 quickstart kernel, whose CRNG never initialises without
    an entropy source (predates CONFIG_RANDOM_TRUST_CPU), so getrandom()
    blocked forever and hung Python (pydantic) at import — now defaults to a
    modern 5.10 CI kernel; (2) vm-config.json.tmpl gained a virtio-rng
    entropy device + random.trust_cpu=on; (3) build-rootfs.sh strips
    /.dockerenv so the containerized probe is honest. Re-verified end to end
    with the committed defaults after those fixes.
