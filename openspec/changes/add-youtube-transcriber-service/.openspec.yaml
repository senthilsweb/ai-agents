schema: spec-driven
name: add-youtube-transcriber-service
status: verified
amends: add-youtube-transcriber
approval:
  reviewed_by: senthilsweb
  reviewed_date: 2026-07-24
  note: >
    Raised 2026-07-24. This change AMENDS the 2026-07-23 Inception gate of
    add-youtube-transcriber, which recorded the agent as local CLI only —
    specifically it reopens gate items (3) "CLI-only invocation, no CI, no
    server" and (6) "NO Docker in v1". The owner now wants the same
    pipeline exposed as a long-lived REST service running inside a
    Firecracker microVM on a KVM Linux host (Ubuntu 24.04), with the ASR
    model held resident in RAM so a request does not pay a model load. A
    GitHub Actions workflow builds the image and publishes it to GHCR
    (ghcr.io/senthilsweb/youtube-transcriber) so it can be pulled onto the
    deployment host — this is the "no CI" part of item (3) being reopened;
    added at owner request 2026-07-24, auth via the built-in GITHUB_TOKEN,
    no custom build secret.

    Three owner decisions taken when the change was raised: (1) this goes
    through the full openspec process as its own change rather than editing
    the original in place; (2) the Firecracker host tooling is GENERIC and
    agent-agnostic, living in a new top-level infra/firecracker/ so any
    agent can be deployed the same way, not hardcoded to this one; (3) the
    ~1GB distil-large-v3 (int8) weights are BAKED into the rootfs so the
    microVM boots with no download and no network dependency for weights.

    What does NOT change: the LangGraph pipeline itself (pipeline/*.py) is
    untouched — the service imports and calls run_one/Config/parse_video_ref
    as-is. The CLI path (run.py) keeps working exactly as before. The
    zero-LLM, zero-token, local-ASR property is preserved: the server adds
    HTTP and job orchestration, no model reasoning. The copyright constraint
    is preserved and strengthened for the server case — transcripts are
    verbatim third-party speech, stay inside the VM, and are returned only
    to the requesting caller; runs/ is never committed or published.

    Owner approved and directed Construction 2026-07-24.

    Construction complete 2026-07-24 (code level). Delivered: server/app.py
    (FastAPI, resident model via transcribe.load_model, async job queue,
    /transcribe + /jobs/{id} + artifact endpoints + /healthz), agent-root
    Dockerfile with distil-large-v3 int8 weights baked in, generic
    infra/firecracker/ (install-firecracker.sh, setup-net.sh, build-rootfs.sh,
    vm-config.json.tmpl, boot.sh), and CI workflow
    youtube-transcriber-image.yml (tests + GHCR image on main). pyproject
    gained fastapi/uvicorn/httpx; the pipeline and run.py are untouched.
    Tests: 90 pytest green (73 pipeline + graph + 7 new server tests in
    tests/test_server.py), no network, no model, no secrets. Shell scripts
    pass `bash -n`; the Firecracker config template renders to valid JSON.

    CI: green as of 2026-07-24 (run 30096044471) after two pre-existing
    test-path fixes surfaced by first CI exposure — pytest `pythonpath=["."]`
    so `import run` resolves under bare pytest, and installing the `telemetry`
    extra in CI so test_telemetry collects. The image job now publishes
    ghcr.io/senthilsweb/youtube-transcriber (latest + sha- + date tags).

    Live deployment verification (2026-07-24, host 5.75.250.223, Rocky Linux
    10.2, x86_64, Docker 29.5.3): the image was built on the host in 2m48s
    (4.45 GB, weights baked) and run as a container bound to 127.0.0.1.
    VERIFIED live: startup warms distil-large-v3 from the baked weights in
    ~4s with NO download; /healthz returns ready:true, model_loaded:true; a
    POST /transcribe drove the full async job path through the worker and
    yt-dlp, and a failure was captured cleanly as status:error with the real
    message while the artifact endpoint correctly returned 409. So the
    service, resident model, job lifecycle, and graceful-failure contract are
    proven on a real RHEL-family host.

    MICROVM BOOT — VERIFIED 2026-07-24 on Intel bare metal (Vultr,
    45.32.92.209, native /dev/kvm). Booted as a real Firecracker microVM via
    the generic infra/firecracker/ tooling with the COMMITTED artifacts and no
    overrides: default boot reached /healthz ready:true, model_loaded:true with
    distil-large-v3 resident in ~8s, guest kernel 5.10.233 vs host 6.8.0. A
    POST /transcribe drove the full job path and failed gracefully on the
    YouTube datacenter-IP block (status:error) — the graceful-failure
    requirement, verified. The bring-up surfaced and fixed four infra defects
    that only appear on a real boot (docker export drops the image's runtime
    env): old 4.14 kernel hung getrandom (-> modern 5.10 + entropy device),
    no PATH in init, and no HOME (-> HuggingFace couldn't find the baked cache).
    fc-init now sets HOME=/root and sources the image ENV; see infra commits
    a5667df, 062fc32, 378f19e, f955b8f.

    The single remaining item is REAL TRANSCRIPT CONTENT: YouTube bot-blocks
    datacenter IPs, so producing actual transcript text needs a YT_COOKIES_FILE
    or a non-datacenter IP. This is an external policy limitation, not an
    unverified requirement — every requirement of this change (service,
    resident model, job lifecycle, graceful failure, container AND microVM
    deployment) is verified. The transcript accuracy spot-check remains the
    same human check the underlying add-youtube-transcriber change already
    tracks.
