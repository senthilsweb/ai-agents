# Umbrella wiki for the ai-agents monorepo, published to GitHub Pages by
# .github/workflows/job-scout-docs.yml.
#
# Each agent with a docs/ folder is merged in via the mkdocs-monorepo
# plugin (one !include per agent; the child's site_name becomes its URL
# namespace). Old top-level job-scout URLs keep working via redirects.
# Specs: agents/job-scout/openspec/changes/job-scout-wiki/design.md (D5),
#        openspec/changes/docs-monorepo-job-pilot/
site_name: ai-agents
site_url: https://senthilsweb.github.io/ai-agents/
repo_url: https://github.com/senthilsweb/ai-agents
repo_name: senthilsweb/ai-agents
edit_uri: edit/main/

docs_dir: docs
site_dir: site
# Marked "Internal reference" in its own header — not for the public site.
exclude_docs: |
  openobserve-claude-code-query-cookbook.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Architecture: ARCHITECTURE.md
  - job-scout: '!include ./agents/job-scout/mkdocs.yml'
  - job-pilot: '!include ./agents/job-pilot/mkdocs.yml'

plugins:
  - search
  - monorepo
  - redirects:
      # job-scout pages lived at the site root before the monorepo
      # split (2026-07-15). Every published URL keeps working.
      redirect_maps:
        getting-started.md: job-scout/getting-started.md
        installation.md: job-scout/installation.md
        configuration.md: job-scout/configuration.md
        data-and-queries.md: job-scout/data-and-queries.md
        dashboards-and-reports.md: job-scout/dashboards-and-reports.md
        runbook.md: job-scout/runbook.md
        ci-cd.md: job-scout/ci-cd.md
        faq.md: job-scout/faq.md
        api-match-pipeline.md: job-scout/api-match-pipeline.md
        style-guide.md: job-scout/style-guide.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  # lives in agents/job-scout/docs/, so it lands under /job-scout/ now
  - job-scout/javascripts/tablesort.js
