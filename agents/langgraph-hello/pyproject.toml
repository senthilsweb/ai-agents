[project]
name = "langgraph-hello"
version = "0.1.0"
description = "A tiny LangGraph StateGraph example + Firecracker microVM smoke test (no LLM)"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the agent root on sys.path so tests can `import run` under a bare
# `pytest` invocation (learned from youtube-transcriber's CI).
pythonpath = ["."]
