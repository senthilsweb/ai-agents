[project]
name = "youtube-transcriber"
version = "0.1.0"
description = "Full audio transcript from a YouTube video — local ASR, zero LLM tokens"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "pydantic>=2.7",
    "yt-dlp>=2025.1.15",
    "faster-whisper>=1.1.0",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
objectstore = [
    "boto3>=1.34",  # optional S3/MinIO mirror of run artifacts
]
telemetry = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the agent root on sys.path so tests can `import run` (a top-level script,
# not a package) under a bare `pytest` invocation — `python -m pytest` adds cwd
# implicitly, plain `pytest` (as CI runs it) does not.
pythonpath = ["."]
