# job-pilot configuration. Tunables only — secrets live in .env / GitHub
# secrets, never here (openspec/changes/add-job-pilot/design.md §Secrets).

parquet:
  # {ref} is "main" (latest) or a "trends/YYYYMMDD" tag (any past day).
  url_template: "https://raw.githubusercontent.com/senthilsweb/ai-agents/{ref}/agents/job-scout/data/ats_raw_trends.parquet"

filter:
  # Only US (or ambiguous-remote) locations reach the paid /analyze call
  # (openspec/changes/us-location-filter/). Dropped jobs still show in
  # the digest table, so nothing disappears silently.
  us_only: true
  # Pinned at the Inception gate 2026-07-15: Sales & GTM included because
  # Solutions Architect / Forward Deployed Engineer roles are filed there.
  categories:
    - "Engineering & Tech"
    - "Product"
    - "Sales & GTM"
  # title_keywords and base_salary_min_usd are read from job-scout's
  # config (single source of truth for the owner's targets).
  targets_config: "../job-scout/config.yaml"

matcher:
  pdf_band_threshold: "good_match"    # attach cover letters from this band up
  max_jobs_per_run: 25                # above this, skip the paid match step
                                       # this run only (not an abort — see
                                       # graceful-match-cap); MAX_JOBS_PER_RUN
                                       # env overrides this for one run
  batch_size: 5

resumes:
  # DOCX files synced by tools/sync_resumes.py (phone number scrubbed —
  # this repo is public; LETTERHEAD_PHONE is injected when attaching).
  # The master is both the scored text and the fallback attachment.
  # Spec: openspec/changes/resume-variants/.
  dir: "./inputs/resumes"
  fallback: "master"
  # First rule whose title_contains matches (case-insensitive substring)
  # wins. Order matters: "Forward Deployed Engineering Manager" matches
  # the manager rule first. No match -> fallback. Attached for the same
  # bands as the cover letters (matcher.pdf_band_threshold).
  rules:
    - variant: "eng-manager"
      title_contains: ["engineering manager"]
    - variant: "genai-fde"
      title_contains: ["forward deployed", "ai engineer", "applied ai",
                       "solutions architect", "ai transformation"]
    - variant: "data-genai-fde"
      title_contains: ["data platform", "data architect", "data engineer"]

jev:
  # TypeSafe Jev decides the fuzzy rules (location, role fit, resume
  # variant). JEV_MODE env: off (default) | shadow | enforce; no
  # TYPESAFE_API_KEY means off. Spec: openspec/changes/jev-rules-gate/.
  api_url: "https://api.typesafe.ai/v1/systemone"
  model: "jev-latest"            # pin (e.g. jev-1.13.0) before enforce
  timeout_s: 20
  max_retries: 2                 # 429/529 only, exponential backoff
  breaker_after: 5               # consecutive errors, then rules decide
  near_miss_floor: 0.30          # digest lists rejections Jev still gave >= this chance to pass
  thresholds:                    # confidence needed for Jev to decide
    location: 0.85
    target_role: 0.85
    variant: 0.70
  questions:                     # only job facts are ever sent with these
    location:
      instructions: "Where is this job located, for a candidate based in the United States?"
      criteria:
        us: "On-site or hybrid at a United States location"
        remote_us: "Remote and open to candidates in the United States"
        non_us: "Located outside the United States, or remote only for another country"
        unclear: "The location is empty or too vague to tell"
    target_role:
      instructions: "The job title is one of these target role families: {targets}."
    variant:
      instructions: "Which resume variant fits this job best?"
      criteria:
        master: "General senior engineering, product or platform leadership role"
        genai-fde: "Forward deployed, applied AI, AI engineer, solutions architect or AI transformation role"
        data-genai-fde: "Data platform, data architecture or data engineering role"
        eng-manager: "Engineering manager or people-leadership role"

email:
  # Placeholders: {date} dd-mmm-yyyy, {new}, {candidates}, {matched},
  # {strong}, {pdfs}. Unknown placeholders render empty (never block
  # the send). Spec: openspec/changes/email-recipients-subject/.
  subject_template: "[job-pilot] {matched} matches ({strong} strong) · {new} new · {date}"

logging:
  dir: "./logs"
  level: "INFO"
