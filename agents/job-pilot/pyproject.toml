[project]
name = "job-pilot"
version = "0.1.0"
description = "Daily job qualification and outreach digest — LangGraph pipeline over job-scout's public parquet and the deployed job-matcher API"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "fpdf2>=2.7",
    "langgraph>=0.2",
    "python-dotenv>=1.0",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
