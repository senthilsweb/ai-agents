# job-search-pipeline configuration
# All tunable parameters live here. Secrets (API keys) go in .env, never here.

candidate:
  name: "Senthilnathan Karuppaiah"
  resume_path: "./inputs/sk-resume-june-2026.md"   # generated by tools/resume_to_md.py (deterministic)
  location: "New Jersey, USA"
  work_authorization: "H-1B transfer (cap-exempt)"

targets:
  base_salary_min_usd: 220000      # raised bar per 20+ yrs experience
  ote_min_usd: 300000
  ote_max_usd: 400000
  role_families:                   # maps to job_posting.role_family
    - eng_manager
    - architect
    - governance_lead
    - genai_platform
    - privacy_eng
  title_keywords:
    - "senior engineering manager"
    - "data governance"
    - "data platform architect"
    - "principal solutions architect"
    - "ai governance"
  preferred_locations: ["NY", "NJ", "Remote US"]
  domains_boost: ["healthcare", "life sciences"]

scoring:
  weights:                         # must sum to 1.0
    domain_fit: 0.50
    compensation: 0.35
    hls_bonus: 0.15
  comp_norm_divisor_usd: 280000    # band midpoint normalizer
  location_penalty_out_of_state: 0.7
  visa_gate: true                  # visa_sponsorship='no' -> score 0
  freshness_max_age_days: 45       # postings older than this get flagged stale

logging:
  dir: "./logs"
  level: "INFO"

database:
  path: "./job_tracker.duckdb"
  export_dir: "./exports"

search:
  # deterministic query templates; {company}, {keyword} interpolated
  query_templates:
    - "{company} careers {keyword} salary remote 2026"
    - "site:{ats_domain} {keyword}"
  ats_org_slugs_by_company:      # Tier 1 deterministic fetch targets
    Snowflake: "snowflake"                          # Ashby board slug
    "Monte Carlo": "montecarlodata"                 # Ashby board slug
    NVIDIA: "nvidia/NVIDIAExternalCareerSite"       # Workday tenant/site (host wd5)
  ats_domains:
    workday: "myworkdayjobs.com"
    ashby: "jobs.ashbyhq.com"
    greenhouse: "boards.greenhouse.io"
    lever: "jobs.lever.co"
  max_results_per_company: 5
  verify_before_insert: true       # fetch posting to confirm open + extract req_id
  recrawl_ttl_days: 7              # skip queries crawled within this window (crawl_log)

agentic:
  enabled: false                   # flip on when ANTHROPIC_API_KEY set in .env
  model: "claude-sonnet-4-6"
  max_searches_per_run: 10
  prompts_dir: "./prompts"         # system.md + task prompts live here, versioned
  skills_dir: "./skills"           # reusable skill docs (AI-DLC style)
