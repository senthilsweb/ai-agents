# job-search-pipeline configuration
# All tunable parameters live here. Secrets (API keys) go in .env, never here.

candidate:
  name: "Senthilnathan Karuppaiah"
  resume_path: "./inputs/sk-resume-june-2026.md"   # generated by tools/resume_to_md.py (deterministic)
  location: "New Jersey, USA"
  work_authorization: "H-1B transfer (cap-exempt)"

targets:
  base_salary_min_usd: 220000      # raised bar per 20+ yrs experience
  ote_min_usd: 300000
  ote_max_usd: 400000
  role_families:                   # maps to job_posting.role_family
    - eng_manager
    - architect
    - governance_lead
    - genai_platform
    - privacy_eng
  title_keywords:
    - "senior engineering manager"
    - "data governance"
    - "data platform architect"
    - "principal solutions architect"
    - "ai governance"
    - "ai engineer"
    - "forward deployed engineer"
    - "engineering manager"
    - "product manager"
    - "ai transformation"
    - "applied ai"
  preferred_locations: ["NY", "NJ", "Remote US"]
  domains_boost: ["healthcare", "life sciences"]

scoring:
  weights:                         # must sum to 1.0
    domain_fit: 0.50
    compensation: 0.35
    hls_bonus: 0.15
  comp_norm_divisor_usd: 280000    # band midpoint normalizer
  location_penalty_out_of_state: 0.7
  visa_gate: true                  # visa_sponsorship='no' -> score 0
  freshness_max_age_days: 45       # postings older than this get flagged stale

logging:
  dir: "./logs"
  level: "INFO"

database:
  path: "./job_tracker.duckdb"
  export_dir: "./exports"

search:
  # deterministic query templates; {company}, {keyword} interpolated
  query_templates:
    - "{company} careers {keyword} salary remote 2026"
    - "site:{ats_domain} {keyword}"
  ats_org_slugs_by_company:      # Tier 1 deterministic fetch targets
    # Value forms: bare string = Ashby slug; "tenant/site" = Workday;
    # dict {slug: ..., platform: greenhouse|lever} for those platforms.
    # Slugs are passed to the ATS API verbatim (case/spaces/dots matter).
    Snowflake: "snowflake"                          # Ashby board slug
    "Monte Carlo": "montecarlodata"                 # Ashby board slug
    NVIDIA: "nvidia/NVIDIAExternalCareerSite"       # Workday tenant/site (host wd5)
    "Grow Therapy": "grow-therapy"                  # Ashby board slug
    # ── verified Ashby boards, added 2026-07-13 (see scratch map_verify) ──
    OpenAI: "openai"
    UiPath: "uipath"
    Xero: "xero"
    Ramp: "ramp"
    Notion: "notion"
    Cursor: "cursor"
    Linear: "linear"
    Vanta: "vanta"
    Replit: "replit"
    Harvey: "harvey"
    Sierra: "sierra"
    Plaid: "plaid"
    Zapier: "zapier"
    Deliveroo: "deliveroo"
    Lime: "lime"                                    # posting API disabled -> GraphQL fallback (no posted dates)
    Ironclad: "ironcladhq"
    Confluent: "confluent"
    Kong: "kong"
    "Eight Sleep": "eightsleep"
    HackerOne: "hackerone"
    PostHog: "posthog"
    Lemonade: "Lemonade"
    Clay: "claylabs"
    Cohere: "cohere"
    Quora: "quora"
    Trainline: "trainline"
    "Help Scout": "helpscout"
    Sanity: "sanity"
    Nivoda: "nivoda"
    "Lightspeed Commerce": "lightspeed"
    "1Password": "1password"
    Scribe: "scribe"
    "Rad AI": "radai"
    "Axion Ray": "axion"
    Nango: "Nango"
    GameChanger: "gamechanger"
    Andela: "andela"
    Semperis: "semperis"
    CoinTracker: "cointracker"
    "Solana Foundation": "Solana Foundation"
    Oyster: "oyster"
    "Juniper Square": "junipersquare"
    Away: "away"
    Flock: "Flock Safety"
    NETGEAR: "netgear"
    Multiverse: "multiverse"
    Brightline: "hellobrightline"
    Alan: "alan"
    amo: "amo"
    January: "january"
    "Infinite Lambda": "Infinite Lambda"
    Brigit: "brigit"
    Zello: "zello"
    hyperexponential: "hyperexponential"
    Leapsome: "leapsome"
    Hiya: "hiya"
    Altura: "altura"
    "Aurora Solar": "aurorasolar"
    Coder: "coder"
    Dave: "dave"
    FullStory: "fullstory"
    "Form Energy": "formenergy"
    "Modern Treasury": "moderntreasury"
    Stytch: "stytch"
    Cryptio: "cryptio"
    Hopper: "hopper"
    Cognition: "cognition"
    Lovable: "lovable"
    Modal: "modal"
    "Liquid AI": "liquid-ai"
    "Julius AI": "julius"
    XBOW: "xbowcareers"
    Kraken: "kraken.com"
    Scribd: "ScribdInc"
    "Super.com": "super.com"
    Benepass: "benepass"
    Socure: "socure"
    PLAUD: "Plaud"
    Sesame: "sesame"
    Baseten: "baseten"
    Writer: "writer"
    "Basis AI": "basis-ai"
    Cleric: "cleric"
    "Kepler AI": "kepler-ai"
    "Manus AI": "manusai"
    AtoB: "atob"
    Highbeam: "highbeam"
    Hadrian: "hadrian-automation"
    "Rivian and Volkswagen Group Technologies": "rivianvw.tech"
    # ── Greenhouse boards (explicit platform) ──
    Machinify: {slug: "machinifyinc", platform: "greenhouse"}
    Calm: {slug: "calm", platform: "greenhouse"}
    # Not loadable (checked 2026-07-13): Shopify/Boomi (own ATS), Retool
    # (Greenhouse public board API disabled), Reddit/Mercury/Deel/
    # Convictional/"Luma AI" (dormant Ashby boards, zero postings).
  ats_domains:
    workday: "myworkdayjobs.com"
    ashby: "jobs.ashbyhq.com"
    greenhouse: "boards.greenhouse.io"
    lever: "jobs.lever.co"
  max_results_per_company: 5
  verify_before_insert: true       # fetch posting to confirm open + extract req_id
  recrawl_ttl_days: 7              # skip queries crawled within this window (crawl_log)
  max_posting_age_days: 30         # skip feed postings older than this (undated feeds kept)
  refresh_mode: "delta"            # delta = insert new reqs only (default)
                                   # snapshot = delta + close open rows gone from the live board

matcher:                           # agent-job-matcher API pipeline (openspec/changes/api-match-report)
  api_base: "https://jobmatch-api.nathansweb.com"     # POST /analyze, GET /health (env override: JOBMATCH_API_BASE)
  agent_base: "https://jobmatch-agent.nathansweb.com" # POST /upload (env override: JOBMATCH_AGENT_BASE)
  resume_path: "./inputs/sk-resume-june-2026.md"      # placeholder — point to your resume (PDF/DOCX/TXT/MD) for real runs
  batch_size: 3                    # jobs per /analyze request (matches server JOB_FANOUT_CONCURRENCY)
  export_dir: "./exports"          # dated run dirs land under here: jobmatch-YYYYMMDD/

agentic:
  enabled: false                   # flip on when ANTHROPIC_API_KEY set in .env
  model: "claude-sonnet-4-6"
  max_searches_per_run: 10
  prompts_dir: "./prompts"         # system.md + task prompts live here, versioned
  skills_dir: "./skills"           # reusable skill docs (AI-DLC style)
