name: tvs-stats-extractor
description: >-
  Serverless half of the cmg pipeline: given a YouTube video reference,
  drives transcription through the owner's transcriber service (custom
  tools, host-executed), then extracts quantified business-value stats
  from the transcript with its own inference and persists the page —
  schema-gated by the driver — to the MinIO-backed db.json.
model:
  id: claude-opus-5
  effort: medium
system: "@./system_prompt.md"
tools:
  - type: agent_toolset_20260401
    default_config:
      enabled: false
  - type: custom
    name: start_transcription
    description: >-
      Submit a YouTube URL or 11-char video id to the transcription
      service. Returns JSON with job_id, or an error if the input is
      rejected. If the transcript may already exist, try fetch_transcript
      first — it is free and instant.
    input_schema:
      type: object
      properties:
        url:
          type: string
          description: YouTube URL or bare 11-char video id
      required: [url]
  - type: custom
    name: check_job
    description: >-
      Check a transcription job. Returns JSON status
      (queued|running|done|error) plus video_id and word count when done.
      Call it repeatedly until terminal — the driver waits between polls,
      so calling again after "running" is correct and cheap.
    input_schema:
      type: object
      properties:
        job_id: { type: string }
      required: [job_id]
  - type: custom
    name: fetch_transcript
    description: >-
      Fetch the latest stored transcript for an 11-char video id. Returns
      the full transcript.md text (header lines then timestamped
      paragraphs), or an error if no transcript exists yet.
    input_schema:
      type: object
      properties:
        video_id:
          type: string
          description: exactly 11 chars, [A-Za-z0-9_-]
      required: [video_id]
  - type: custom
    name: persist_page
    description: >-
      Persist the extraction for a video. Takes the ExtractedContent JSON
      as a string; the driver validates it against the schema and upserts
      the page into db.json. On validation failure the result is an error
      listing exactly what to fix — correct the JSON and call again.
    input_schema:
      type: object
      properties:
        video_id: { type: string }
        content_json:
          type: string
          description: ExtractedContent as a JSON string (not an object)
      required: [video_id, content_json]
