name: tvs-stats-env
description: >-
  Zero-trust sandbox for the talk-value-stats extractor agent. The agent
  works entirely through its custom tools (executed host-side by the
  session driver, which holds every credential — see
  openspec/changes/deploy-stats-managed-agent design D2); the sandbox
  itself needs no network, no packages, no secrets.
config:
  type: cloud
  # Effectively zero-network: the API has no `none` type (only
  # limited|unrestricted — 400 verified 2026-08-09), so this is `limited`
  # with no package managers and no allowed hosts.
  networking:
    type: limited
    allow_package_managers: false
    allowed_hosts: []
