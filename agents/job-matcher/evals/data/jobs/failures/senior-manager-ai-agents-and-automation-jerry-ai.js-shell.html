  <meta name="description" content="WHY JERRY.AI http://Jerry.ai?

 - Join a pre-IPO startup with capital ($240M raised), traction (5M+ customers), and runway (we’re profitable).

 - Impact: Come lead our customer-facing Agentic AI product leveraging LLMs, agents, and internal APIs to create a magical experience for our customers. Work with partners like OpenAI to integrate http://jerry.aiJerry.ai http://Jerry.ai services directly into the ChatGPT App and pioneer new model capabilities.

 - Accelerated career growth. We have a flat org chart, ambitious goals, and no shortage of opportunities for people who want more. You’ll also report directly to our COO, leading one of our most important growth levers.
   
    


WHY WE’RE HIRING THIS ROLE:

Your car and your home are your most important assets, yet the experience of owning one is stuck in the 90s. Every part of the journey — buy/sell, insurance, maintenance, repairs — is fragmented, complicated, and expensive. Jerry.ai http://Jerry.ai is building the first app to manage it all.

We launched car insurance in 2019 and became one of the top three brokers in the country. We got there in part because we were early on generative AI. Before off-the-shelf platforms existed, we built our own infrastructure to automate sales and service conversations. Today, that system handles a meaningful share of customer interactions end-to-end. The underlying technology is entirely homegrown.

That head start created real leverage. It also created real complexity. Prompts that power everything from the customer-facing chatbot to vehicle photo validation to back-office automation now live across six separate locations. There is no single source of truth, no unified platform, and no clear owner of where the next big bets — voicebot, computer use, consumer AI applications — belong on the roadmap. That is what you will own.


HOW YOU’LL MAKE AN IMPACT:

You will sit at the intersection of product, engineering, and applied AI as you build and scale a sophisticated system that already automates &gt;70% of inbound sales and service requests (over 50k chats per month). Your role will include shaping how modern LLM systems, human-in-the-loop feedback, and computer-use agents redefine an entire industry. Specifically:

 - Lead end-to-end development for our AI platform and customer experiences, from initial roadmap to rollout.

 - Partner with engineers to design prompt strategies, evaluation frameworks, and guardrails—balancing latency, cost, and accuracy.

 - Serve as the technical translator between engineering and the broader organization, establishing AI best practices and platform standards.

 - Drive systematic improvement in answer quality, customer satisfaction, and automation rates through rigorous experimentation.

 - Work with partners at OpenAI to evaluate and deploy the next generation of voice models and workflow automation.

 


WHO YOU ARE:

 - Technologist: You live and breathe AI. You read the release notes when a new model drops and you’ve already built your own custom workflows.

 - Systems Thinker: You are comfortable diving into technical conversations about API design and system architecture, translating complex concepts for any audience.

 - Experimenter: You think only in terms of what’s possible. AI is rapidly evolving, and you’re constantly tinkering and finding new capabilities that didn’t exist yesterday.

 - Data-Driven: You are familiar with SQL and comfortable diving into the data to answer your own questions and validate hypotheses.

 - Pragmatic: You can navigate technical tradeoffs and lead by example when implementing AI platform standards.

 


IDEAL EXPERIENCE:

 - 4+ years of experience in a technical role like forward deployed engineering, technical product management, or similar at a fast-paced startup.

 - Passion and curiosity for AI systems including modern LLMs, etc.

 - Track record of taking complex, strategic ideas and turning them into scalable, production-grade products.

 

While we appreciate your interest and application, due to the volume of applications we receive, only applicants under consideration will be contacted.

Please note: Jerry.ai is only able to hire employees who currently reside in AZ, CA, CO, FL, GA, IL, MA, NC, NJ, NV, NY, OR, TN, TX, UT, VA, or Ontario, Canada. We cannot accept applications from candidates residing elsewhere at this time.

Jerry.ai is proud to be an Equal Employment Opportunity employer. We prohibit discrimination based on race, religion, color, national origin, sex, pregnancy, reproductive health decisions or related medical conditions, sexual orientation, gender identity, gender expression, age, veteran status, disability, genetic information, or other characteristics protected by applicable local, state or federal laws.

Jerry.ai is committed to providing reasonable accommodations for individuals with disabilities in our job application process. If you need assistance or an accommodation due to a disability, please contact us at recruiting@jerry.ai recruiting@getjerry.com

The successful candidate’s starting pay will fall within the pay range listed on this job posting, determined based on job-related factors including, but not limited to, skills, experience, qualifications, work location, and market conditions. Ranges are market-dependent and may be modified in the future. In addition to base salary, the compensation may include opportunities for equity grants.

We offer a comprehensive benefits package to regular employees, including health, dental, and vision coverage, paid time off, paid parental leave, 401(K) plan with employer matching, and wellness benefits, among others. Equity opportunities may also be part of your total rewards package. Part-time, contract, or freelance roles may not be eligible for certain benefits.

About Jerry.ai

Your car and your home are your most expensive assets. And for most people, these aren&#39;t just purchases, they&#39;re the physical embodiment of the life you&#39;ve worked hard to build. Yet the experience of owning them is stuck in the 90s. Every step of the journey — buying, insuring, maintaining, repairing, selling — is fragmented, complicated, and expensive.

Imagine having a trusted friend in your pocket who takes care of everything: they find you the right car or home at the right price, lock in the best insurance rate without you lifting a finger, remind you before that service appointment turns into an expensive repair or, worse, an accident, and help you sell at the best price when the time is right. That friend is Jerry.

Jerry is building the first AI agent to manage all your physical assets. We started with car insurance in 2019, became one of the top 3 brokers in the U.S., then added driving insights, diagnostics, and a repair marketplace.

We&#39;ve reached 5M+ customers, raised $240M+, and have been profitable since 2024. We&#39;re now expanding into home, motorcycle, RV, and beyond.

We’re fully remote with offices in Palo Alto, New York, Chicago, and Toronto.

n touch if your qualifications match our needs for the role. If you are not selected for this position, please keep an eye on our careers page as we're growing and adding additional openings.","jobBoardTopDescriptionHtml":null,"jobBoardBottomDescriptionHtml":null,"jobPostingBackUrl":null},"appConfirmationTrackingPixelHtml":null,"recruitingPrivacyPolicyUrl":null,"timezone":"America/Los_Angeles","candidateScheduleCancellationReasonRequirementStatus":"Off","showCookieBanner":false},"posting":{"id":"b8857bb2-9861-4188-88c9-800fe4495409","title":"Senior Manager, AI Agents and Automation","updatedAt":"2026-07-07T21:15:39.220Z","departmentName":"Product","departmentExternalName":"Product","teamName":"Product Management","teamExternalName":"Product Management","teamNames":["Product","Product Management"],"locationName":"New York, New York","locationExternalName":"New York, New York","isListed":true,"suppressDescriptionOpening":false,"suppressDescriptionClosing":false,"descriptionHtml":"<h2><strong>Why </strong><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"http://Jerry.ai\"><strong><u>Jerry.ai</u></strong></a><strong>?</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Join a pre-IPO startup with capital ($240M raised),  traction (5M+ customers), and runway (we’re profitable).</p></li><li><p style=\"min-height:1.5em\">Impact: Come lead our customer-facing Agentic AI product leveraging LLMs, agents, and internal APIs to create a magical experience for our customers. Work with partners like OpenAI to integrate<a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"http://jerry.ai\"> </a><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"http://Jerry.ai\"><u>Jerry.ai</u></a> services directly into the ChatGPT App and pioneer new model capabilities.</p></li><li><p style=\"min-height:1.5em\">Accelerated career growth. We have a flat org chart, ambitious goals, and no shortage of opportunities for people who want more. You’ll also report directly to our COO, leading one of our most important growth levers.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div></li></ul><h2><strong>Why we’re hiring this role:</strong></h2><p style=\"min-height:1.5em\">Your car and your home are your most important assets, yet the experience of owning one is stuck in the 90s. Every part of the journey — buy/sell, insurance, maintenance, repairs — is fragmented, complicated, and expensive. <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"http://Jerry.ai\">Jerry.ai</a> is building the first app to manage it all.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">We launched car insurance in 2019 and became one of the top three brokers in the country. We got there in part because we were early on generative AI. Before off-the-shelf platforms existed, we built our own infrastructure to automate sales and service conversations. Today, that system handles a meaningful share of customer interactions end-to-end. The underlying technology is entirely homegrown.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">That head start created real leverage. It also created real complexity. Prompts that power everything from the customer-facing chatbot to vehicle photo validation to back-office automation now live across six separate locations. There is no single source of truth, no unified platform, and no clear owner of where the next big bets — voicebot, computer use, consumer AI applications — belong on the roadmap. That is what you will own.</p><p style=\"min-height:1.5em\"></p><h2><strong>How you’ll make an impact: </strong></h2><p style=\"min-height:1.5em\">You will sit at the intersection of product, engineering, and applied AI as you build and scale a sophisticated system that already automates &gt;70% of inbound sales and service requests (over 50k chats per month). Your role will include shaping how modern LLM systems, human-in-the-loop feedback, and computer-use agents redefine an entire industry. Specifically:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Lead end-to-end development for our AI platform and customer experiences, from initial roadmap to rollout.</p></li><li><p style=\"min-height:1.5em\">Partner with engineers to design prompt strategies, evaluation frameworks, and guardrails—balancing latency, cost, and accuracy.</p></li><li><p style=\"min-height:1.5em\">Serve as the technical translator between engineering and the broader organization, establishing AI best practices and platform standards.</p></li><li><p style=\"min-height:1.5em\">Drive systematic improvement in answer quality, customer satisfaction, and automation rates through rigorous experimentation.</p></li><li><p style=\"min-height:1.5em\">Work with partners at OpenAI to evaluate and deploy the next generation of voice models and workflow automation.</p></li></ul><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>Who you are:</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Technologist:</strong> You live and breathe AI. You read the release notes when a new model drops and you’ve already built your own custom workflows.</p></li><li><p style=\"min-height:1.5em\"><strong>Systems Thinker:</strong> You are comfortable diving into technical conversations about API design and system architecture, translating complex concepts for any audience.</p></li><li><p style=\"min-height:1.5em\"><strong>Experimenter:</strong> You think only in terms of what’s possible. AI is rapidly evolving, and you’re constantly tinkering and finding new capabilities that didn’t exist yesterday.</p></li><li><p style=\"min-height:1.5em\"><strong>Data-Driven:</strong> You are familiar with SQL and comfortable diving into the data to answer your own questions and validate hypotheses.</p></li><li><p style=\"min-height:1.5em\"><strong>Pragmatic:</strong> You can navigate technical tradeoffs and lead by example when implementing AI platform standards.</p></li></ul><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>Ideal experience:</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">4+ years of experience in a technical role like forward deployed engineering, technical product management, or similar at a fast-paced startup.</p></li><li><p style=\"min-height:1.5em\">Passion and curiosity for AI systems including modern LLMs, etc.</p></li><li><p style=\"min-height:1.5em\">Track record of taking complex, strategic ideas and turning them into scalable, production-grade products.</p></li></ul><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><p style=\"min-height:1.5em\"><em>While we appreciate your interest and application, due to the volume of applications we receive, only applicants under consideration will be contacted.</em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em><strong>Please note: Jerry.ai is only able to hire employees who currently reside in AZ, CA, CO, FL, GA, IL, MA, NC, NJ, NV, NY, OR, TN, TX, UT, VA, or Ontario, Canada. We cannot accept applications from candidates residing elsewhere at this time.</strong></em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em>Jerry.ai is proud to be an Equal Employment Opportunity employer. We prohibit discrimination based on race, religion, color, national origin, sex, pregnancy, reproductive health decisions or related medical conditions, sexual orientation, gender identity, gender expression, age, veteran status, disability, genetic information, or other characteristics protected by applicable local, state or federal laws. </em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em>Jerry.ai is committed to providing reasonable accommodations for individuals with disabilities in our job application process. If you need assistance or an accommodation due to a disability, please contact us at </em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" class=\"ProsemirrorEditor-link\" href=\"mailto:recruiting@getjerry.com\"><em>recruiting@jerry.ai</em></a></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em>The successful candidate’s starting pay will fall within the pay range listed on this job posting, determined based on job-related factors including, but not limited to, skills, experience, qualifications, work location, and market conditions. Ranges are market-dependent and may be modified in the future. In addition to base salary, the compensation may include opportunities for equity grants. </em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em>We offer a comprehensive benefits package to regular employees, including health, dental, and vision coverage, paid time off, paid parental leave, 401(K) plan with employer matching, and wellness benefits, among others. Equity opportunities may also be part of your total rewards package. Part-time, contract, or freelance roles may not be eligible for certain benefits.</em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>About Jerry.ai</strong></p><p style=\"min-height:1.5em\">Your car and your home are your most expensive assets. And for most people, these aren't just purchases, they're the physical embodiment of the life you've worked hard to build. Yet the experience of owning them is stuck in the 90s. Every step of the journey — buying, insuring, maintaining, repairing, selling — is fragmented, complicated, and expensive.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">Imagine having a trusted friend in your pocket who takes care of everything: they find you the right car or home at the right price, lock in the best insurance rate without you lifting a finger, remind you before that service appointment turns into an expensive repair or, worse, an accident, and help you sell at the best price when the time is right. That friend is Jerry.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">Jerry is building the first AI agent to manage all your physical assets. We started with car insurance in 2019, became one of the top 3 brokers in the U.S., then added driving insights, diagnostics, and a repair marketplace. </p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">We've reached 5M+ customers, raised $240M+, and have been profitable since 2024. We're now expanding into home, motorcycle, RV, and beyond.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">We’re fully remote with offices in Palo Alto, New York, Chicago, and Toronto.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div>","descriptionPlainText":"WHY JERRY.AI http://Jerry.ai?\n\n - Join a pre-IPO startup with capital ($240M raised), traction (5M+ customers), and runway (we’re profitable).\n\n - Impact: Come lead our customer-facing Agentic AI product leveraging LLMs, agents, and internal APIs to create a magical experience for our customers. Work with partners like OpenAI to integrate http://jerry.aiJerry.ai http://Jerry.ai services directly into the ChatGPT App and pioneer new model capabilities.\n\n - Accelerated career growth. We have a flat org chart, ambitious goals, and no shortage of opportunities for people who want more. You’ll also report directly to our COO, leading one of our most important growth levers.\n   \n    \n\n\nWHY WE’RE HIRING THIS ROLE:\n\nYour car and your home are your most important assets, yet the experience of owning one is stuck in the 90s. Every part of the journey — buy/sell, insurance, maintenance, repairs — is fragmented, complicated, and expensive. Jerry.ai http://Jerry.ai is building the first app to manage it all.\n\nWe launched car insurance in 2019 and became one of the top three brokers in the country. We got there in part because we were early on generative AI. Before off-the-shelf platforms existed, we built our own infrastructure to automate sales and service conversations. Today, that system handles a meaningful share of customer interactions end-to-end. The underlying technology is entirely homegrown.\n\nThat head start created real leverage. It also created real complexity. Prompts that power everything from the customer-facing chatbot to vehicle photo validation to back-office automation now live across six separate locations. There is no single source of truth, no unified platform, and no clear owner of where the next big bets — voicebot, computer use, consumer AI applications — belong on the roadmap. That is what you will own.\n\n\nHOW YOU’LL MAKE AN IMPACT:\n\nYou will sit at the intersection of product, engineering, and applied AI as you build and scale a sophisticated system that already automates >70% of inbound sales and service requests (over 50k chats per month). Your role will include shaping how modern LLM systems, human-in-the-loop feedback, and computer-use agents redefine an entire industry. Specifically:\n\n - Lead end-to-end development for our AI platform and customer experiences, from initial roadmap to rollout.\n\n - Partner with engineers to design prompt strategies, evaluation frameworks, and guardrails—balancing latency, cost, and accuracy.\n\n - Serve as the technical translator between engineering and the broader organization, establishing AI best practices and platform standards.\n\n - Drive systematic improvement in answer quality, customer satisfaction, and automation rates through rigorous experimentation.\n\n - Work with partners at OpenAI to evaluate and deploy the next generation of voice models and workflow automation.\n\n \n\n\nWHO YOU ARE:\n\n - Technologist: You live and breathe AI. You read the release notes when a new model drops and you’ve already built your own custom workflows.\n\n - Systems Thinker: You are comfortable diving into technical conversations about API design and system architecture, translating complex concepts for any audience.\n\n - Experimenter: You think only in terms of what’s possible. AI is rapidly evolving, and you’re constantly tinkering and finding new capabilities that didn’t exist yesterday.\n\n - Data-Driven: You are familiar with SQL and comfortable diving into the data to answer your own questions and validate hypotheses.\n\n - Pragmatic: You can navigate technical tradeoffs and lead by example when implementing AI platform standards.\n\n \n\n\nIDEAL EXPERIENCE:\n\n - 4+ years of experience in a technical role like forward deployed engineering, technical product management, or similar at a fast-paced startup.\n\n - Passion and curiosity for AI systems including modern LLMs, etc.\n\n - Track record of taking complex, strategic ideas and turning them into scalable, production-grade products.\n\n \n\nWhile we appreciate your interest and application, due to the volume of applications we receive, only applicants under consideration will be contacted.\n\nPlease note: Jerry.ai is only able to hire employees who currently reside in AZ, CA, CO, FL, GA, IL, MA, NC, NJ, NV, NY, OR, TN, TX, UT, VA, or Ontario, Canada. We cannot accept applications from candidates residing elsewhere at this time.\n\nJerry.ai is proud to be an Equal Employment Opportunity employer. We prohibit discrimination based on race, religion, color, national origin, sex, pregnancy, reproductive health decisions or related medical conditions, sexual orientation, gender identity, gender expression, age, veteran status, disability, genetic information, or other characteristics protected by applicable local, state or federal laws.\n\nJerry.ai is committed to providing reasonable accommodations for individuals with disabilities in our job application process. If you need assistance or an accommodation due to a disability, please contact us at recruiting@jerry.ai recruiting@getjerry.com\n\nThe successful candidate’s starting pay will fall within the pay range listed on thi m that already automates &gt;70% of inbound sales and service requests (over 50k chats per month). Your role will include shaping how modern LLM systems, human-in-the-loop feedback, and computer-use agents redefine an entire industry. Specifically:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Lead end-to-end development for our AI platform and customer experiences, from initial roadmap to rollout.</p></li><li><p style=\"min-height:1.5em\">Partner with engineers to design prompt strategies, evaluation frameworks, and guardrails—balancing latency, cost, and accuracy.</p></li><li><p style=\"min-height:1.5em\">Serve as the technical translator between engineering and the broader organization, establishing AI best practices and platform standards.</p></li><li><p style=\"min-height:1.5em\">Drive systematic improvement in answer quality, customer satisfaction, and automation rates through rigorous experimentation.</p></li><li><p style=\"min-height:1.5em\">Work with partners at OpenAI to evaluate and deploy the next generation of voice models and workflow automation.</p></li></ul><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>Who you are:</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Technologist:</strong> You live and breathe AI. You read the release notes when a new model drops and you’ve already built your own custom workflows.</p></li><li><p style=\"min-height:1.5em\"><strong>Systems Thinker:</strong> You are comfortable diving into technical conversations about API design and system architecture, translating complex concepts for any audience.</p></li><li><p style=\"min-height:1.5em\"><strong>Experimenter:</strong> You think only in terms of what’s possible. AI is rapidly evolving, and you’re constantly tinkering and finding new capabilities that didn’t exist yesterday.</p></li><li><p style=\"min-height:1.5em\"><strong>Data-Driven:</strong> You are familiar with SQL and comfortable diving into the data to answer your own questions and validate hypotheses.</p></li><li><p style=\"min-height:1.5em\"><strong>Pragmatic:</strong> You can navigate technical tradeoffs and lead by example when implementing AI platform standards.</p></li></ul><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><h2><strong>Ideal experience:</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">4+ years of experience in a technical role like forward deployed engineering, technical product management, or similar at a fast-paced startup.</p></li><li><p style=\"min-height:1.5em\">Passion and curiosity for AI systems including modern LLMs, etc.</p></li><li><p style=\"min-height:1.5em\">Track record of taking complex, strategic ideas and turning them into scalable, production-grade products.</p></li></ul><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div><p style=\"min-height:1.5em\"><em>While we appreciate your interest and application, due to the volume of applications we receive, only applicants under consideration will be contacted.</em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em><strong>Please note: Jerry.ai is only able to hire employees who currently reside in AZ, CA, CO, FL, GA, IL, MA, NC, NJ, NV, NY, OR, TN, TX, UT, VA, or Ontario, Canada. We cannot accept applications from candidates residing elsewhere at this time.</strong></em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em>Jerry.ai is proud to be an Equal Employment Opportunity employer. We prohibit discrimination based on race, religion, color, national origin, sex, pregnancy, reproductive health decisions or related medical conditions, sexual orientation, gender identity, gender expression, age, veteran status, disability, genetic information, or other characteristics protected by applicable local, state or federal laws. </em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em>Jerry.ai is committed to providing reasonable accommodations for individuals with disabilities in our job application process. If you need assistance or an accommodation due to a disability, please contact us at </em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" class=\"ProsemirrorEditor-link\" href=\"mailto:recruiting@getjerry.com\"><em>recruiting@jerry.ai</em></a></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em>The successful candidate’s starting pay will fall within the pay range listed on this job posting, determined based on job-related factors including, but not limited to, skills, experience, qualifications, work location, and market conditions. Ranges are market-dependent and may be modified in the future. In addition to base salary, the compensation may include opportunities for equity grants. </em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><em>We offer a comprehensive benefits package to regular employees, including health, dental, and vision coverage, paid time off, paid parental leave, 401(K) plan with employer matching, and wellness benefits, among others. Equity opportunities may also be part of your total rewards package. Part-time, contract, or freelance roles may not be eligible for certain benefits.</em></p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\"><strong>About Jerry.ai</strong></p><p style=\"min-height:1.5em\">Your car and your home are your most expensive assets. And for most people, these aren't just purchases, they're the physical embodiment of the life you've worked hard to build. Yet the experience of owning them is stuck in the 90s. Every step of the journey — buying, insuring, maintaining, repairing, selling — is fragmented, complicated, and expensive.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">Imagine having a trusted friend in your pocket who takes care of everything: they find you the right car or home at the right price, lock in the best insurance rate without you lifting a finger, remind you before that service appointment turns into an expensive repair or, worse, an accident, and help you sell at the best price when the time is right. That friend is Jerry.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">Jerry is building the first AI agent to manage all your physical assets. We started with car insurance in 2019, became one of the top 3 brokers in the U.S., then added driving insights, diagnostics, and a repair marketplace. </p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">We've reached 5M+ customers, raised $240M+, and have been profitable since 2024. We're now expanding into home, motorcycle, RV, and beyond.</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">We’re fully remote with offices in Palo Alto, New York, Chicago, and Toronto.</p><div style=\"min-height:1.2em;margin-top:0;margin-bottom:0\"> </div>","directApply":true,"identifier":{"@type":"PropertyValue","name":"Jerry.ai","value":"b8857bb2-9861-4188-88c9-800fe4495409"},"datePosted":"2026-06-29","hiringOrganization":{"@type":"Organization","name":"Jerry.ai","sameAs":"https://www.jerry.ai"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"New York","addressRegion":"New York","addressCountry":"United States"}},"employmentType":"FULL_TIME","baseSalary":{"@type":"MonetaryAmount","currency":"USD","value":{"@type":"QuantitativeValue","minValue":160000,"maxValue":200000,"unitText":"YEAR"}},"jobLocationType":"TELECOMMUTE","applicantLocationRequirements":{"@type":"Country","name":"United States"}},"publishedDate":"2026-06-29","applicationDeadline":null,"structuredMetadataOverride":null,"address":{"postalAddress":{"addressRegion":"New York","addressCountry":"United States","addressLocality":"New York"}},"isRemote":true,"workplaceType":"Remote","employmentType":"FullTime","jobId":"e50afa2f-fdef-4bfd-9d7f-26dd7f8d5330","jobRequisitionId":null,"organization
