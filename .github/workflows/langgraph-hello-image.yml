# Tests on every push touching langgraph-hello; image rebuild + GHCR push on
# main. Mirrors youtube-transcriber-image.yml (with its CI lessons already
# baked into pyproject: pythonpath=["."]). GHCR auth uses the built-in
# GITHUB_TOKEN — no custom secret; the image bakes nothing secret.
name: langgraph-hello tests and image

on:
  push:
    paths:
      - "agents/langgraph-hello/**"
      - ".github/workflows/langgraph-hello-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: langgraph-hello-image
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        working-directory: agents/langgraph-hello
        run: |
          pip install -q -e ".[dev]"
          pytest -q

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/langgraph-hello
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=raw,value={{date 'YYYYMMDD'}}
      - uses: docker/build-push-action@v6
        with:
          context: agents/langgraph-hello
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
