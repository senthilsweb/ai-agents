name: talk-value-stats

# Test and build-check this agent only. It does NOT deploy.
#
# Publishing is owned by the single unified Pages workflow
# (.github/workflows/job-scout-docs.yml), which assembles every app into one
# `site/` and publishes it in one deploy — the stats app lives at
# /ai-native-numbers/. A second workflow calling deploy-pages would silently
# overwrite that whole site (the bug that used to put this app at the root).
#
# No model call here — extraction (extract.py) runs locally with an Anthropic
# key; CI only renders the committed db.json. No secret, and no transcript
# ever touches CI.

on:
  push:
    branches: [main]
    paths:
      - "agents/talk-value-stats/**"
      - ".github/workflows/talk-value-stats.yml"
  pull_request:
    paths:
      - "agents/talk-value-stats/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/talk-value-stats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Build-check dist/ (HTML + stats.parquet)
        # Validates the committed db.json renders; the actual publish of these
        # artifacts happens in the unified site workflow.
        run: |
          python build.py
          test -f dist/index.html
          test -f dist/stats.parquet
