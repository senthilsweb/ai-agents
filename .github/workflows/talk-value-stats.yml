name: talk-value-stats

# Test, build the static "AI value stats" site + stats.parquet from the
# committed JSON DB, and publish to GitHub Pages. No model call here — extraction
# (extract.py) runs locally with an Anthropic key; CI only renders the committed
# db.json. So no secret is needed and no transcript ever touches CI.

on:
  push:
    branches: [main]
    paths:
      - "agents/talk-value-stats/**"
      - ".github/workflows/talk-value-stats.yml"
  pull_request:
    paths:
      - "agents/talk-value-stats/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/talk-value-stats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Build dist/ (HTML + stats.parquet)
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: agents/talk-value-stats/dist

  deploy:
    # Only deploy from main; PRs run test+build but don't publish.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
