name: copy-secrets
on: workflow_dispatch
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.COPY_PAT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          LETTERHEAD_PHONE: ${{ secrets.LETTERHEAD_PHONE }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: |
          for n in SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS DIGEST_FROM DIGEST_TO LETTERHEAD_PHONE LANGSMITH_API_KEY; do
            v="${!n}"
            if [ -n "$v" ]; then
              printf '%s' "$v" | gh secret set "$n" --repo senthilsweb/job-agents && echo "set $n"
            else
              echo "skip $n (empty)"
            fi
          done
