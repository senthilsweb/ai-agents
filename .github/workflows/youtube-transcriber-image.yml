# Tests on every push touching youtube-transcriber; image rebuild + GHCR push
# on main. Same shape as job-pilot-image.yml / job-scout-image.yml.
#
# GHCR auth uses the built-in GITHUB_TOKEN — no custom secret. The image bakes
# no secrets (ASR is fully local, no API key); optional telemetry endpoints are
# supplied as runtime env on the deployment host, not at build time.
#
# Added by openspec change add-youtube-transcriber-service (2026-07-24), which
# amends the original no-Docker/no-CI gate. Spec:
# openspec/changes/add-youtube-transcriber-service/specs/transcript-service/spec.md
#
# NOTE: the package is PRIVATE on first push — flip
# ghcr.io/senthilsweb/youtube-transcriber to public once in GitHub package
# settings if desired (a workflow cannot do it).
name: youtube-transcriber tests and image

on:
  push:
    paths:
      - "agents/youtube-transcriber/**"
      - ".github/workflows/youtube-transcriber-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: youtube-transcriber-image
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        working-directory: agents/youtube-transcriber
        # No network, no model, no secrets — run_one/load_model are stubbed in
        # the tests, so nothing here downloads Whisper weights.
        # Install the telemetry extra too: tests/test_telemetry.py imports
        # `opentelemetry`, which lives in the `telemetry` optional group, not
        # `dev`. Without it collection fails even though telemetry itself
        # degrades to a warning at runtime.
        run: |
          pip install -q -e ".[dev,telemetry]"
          pytest -q

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/youtube-transcriber
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=raw,value={{date 'YYYYMMDD'}}

      - uses: docker/build-push-action@v6
        with:
          # Agent-dir context: the Dockerfile is self-contained (unlike
          # job-pilot's, which needs repo-root for job-scout's config).
          context: agents/youtube-transcriber
          # amd64 only: the Firecracker target is x86_64, and the ~1 GB weights
          # bake step should not run twice under arm64 emulation.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Caches the heavy weights-download layer across runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
