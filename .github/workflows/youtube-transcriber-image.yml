# Tests on every push touching youtube-transcriber; image rebuild + GHCR push
# on main. Same shape as job-pilot-image.yml / job-scout-image.yml.
#
# GHCR auth uses the built-in GITHUB_TOKEN — no custom secret. The image bakes
# no secrets (ASR is fully local, no API key); optional telemetry endpoints are
# supplied as runtime env on the deployment host, not at build time.
#
# Added by openspec change add-youtube-transcriber-service (2026-07-24), which
# amends the original no-Docker/no-CI gate. Spec:
# openspec/changes/add-youtube-transcriber-service/specs/transcript-service/spec.md
#
# MULTI-ARCH (added by add-cmg-local-deploy, 2026-08-09): the image was
# amd64-only because the ~1 GB weights bake must not run under arm64
# emulation. Instead of emulating, each platform builds NATIVELY — amd64 on
# ubuntu-latest, arm64 on the ubuntu-24.04-arm runner — pushing by digest,
# and a merge job stitches one multi-arch manifest. The Firecracker x86_64
# path is unchanged (it pulls the amd64 half); Apple Silicon deploy hosts
# (~/opt/cmg) now pull native arm64 instead of emulating ASR.
#
# NOTE: the package is PRIVATE on first push — flip
# ghcr.io/senthilsweb/youtube-transcriber to public once in GitHub package
# settings if desired (a workflow cannot do it).
name: youtube-transcriber tests and image

on:
  push:
    paths:
      - "agents/youtube-transcriber/**"
      - ".github/workflows/youtube-transcriber-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: youtube-transcriber-image
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        working-directory: agents/youtube-transcriber
        # No network, no model, no secrets — run_one/load_model are stubbed in
        # the tests, so nothing here downloads Whisper weights.
        # Install the telemetry extra too: tests/test_telemetry.py imports
        # `opentelemetry`, which lives in the `telemetry` optional group, not
        # `dev`. Without it collection fails even though telemetry itself
        # degrades to a warning at runtime.
        run: |
          pip install -q -e ".[dev,telemetry]"
          pytest -q

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runner per platform: the weights bake never runs emulated.
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare platform slug
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          # Agent-dir context: the Dockerfile is self-contained (unlike
          # job-pilot's, which needs repo-root for job-scout's config).
          context: agents/youtube-transcriber
          platforms: ${{ matrix.platform }}
          # Push by digest only; the merge job assembles the tagged manifest.
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/youtube-transcriber,push-by-digest=true,name-canonical=true,push=true
          # Caches the heavy weights-download layer across runs, per platform.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/youtube-transcriber
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/youtube-transcriber@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/youtube-transcriber:latest
