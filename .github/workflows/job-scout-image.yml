# Build & push the job-scout pipeline image to GHCR.
# Spec: agents/job-scout/openspec/changes/container-and-publishing/specs/container-runtime/spec.md
#
# The package starts PRIVATE on first push — flip
# ghcr.io/senthilsweb/job-scout to public once in GitHub package
# settings (a workflow cannot do it).
name: job-scout image

on:
  push:
    branches: [main]
    paths:
      - "agents/job-scout/tools/**"
      - "agents/job-scout/templates/**"
      - "agents/job-scout/config.yaml"
      - "agents/job-scout/Dockerfile"
      - "agents/job-scout/docker/**"
      - ".github/workflows/job-scout-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: job-scout-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/job-scout
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=raw,value={{date 'YYYYMMDD'}}

      - uses: docker/build-push-action@v6
        with:
          context: agents/job-scout
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
